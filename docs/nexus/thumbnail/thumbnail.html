<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#000; }
  .layer { position:absolute; background-image:url('base-3s.png'); background-repeat:no-repeat;
           background-size:3840px 2160px; image-rendering:pixelated; }
  /* Fondo: el patio con los cofres y sus burbujas, al 200 % */
  .world { left:0; top:0; width:1920px; height:1080px; background-position:-960px -660px; }
  .world::after { content:''; position:absolute; inset:0;
                  background:linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 45%, rgba(0,0,0,.35) 100%); }
  /* El panel de la cola, al 200 % */
  .panel { right:44px; top:118px; width:670px; height:890px; background-position:-3140px -30px;
           outline:6px solid #1b120c; box-shadow:0 0 0 10px #c89b5a, 0 24px 60px rgba(0,0,0,.8); }
  .title { position:absolute; left:64px; top:70px; font-family:'Pixelify Sans', monospace; }
  .title h1 { margin:0; font-size:150px; line-height:.95; color:#ffd966; letter-spacing:2px;
              text-shadow: 6px 0 #2a1a0e, -6px 0 #2a1a0e, 0 6px #2a1a0e, 0 -6px #2a1a0e,
                           6px 6px #2a1a0e, -6px 6px #2a1a0e, 6px -6px #2a1a0e, -6px -6px #2a1a0e, 0 14px 0 rgba(0,0,0,.55); }
  .title p { margin:26px 0 0; font-size:58px; line-height:1.15; color:#fff4e0;
             text-shadow: 4px 0 #1b120c, -4px 0 #1b120c, 0 4px #1b120c, 0 -4px #1b120c, 4px 4px #1b120c, -4px 4px #1b120c, 4px -4px #1b120c, -4px -4px #1b120c; }
  .title p b { color:#9be07a; }
</style></head>
<body>
  <div class="layer world"></div>
  <div class="layer panel"></div>
  <div class="title">
    <h1>Crafting<br>Queue</h1>
    <p>What you need, what you have<br>&amp; <b>which chest has it</b></p>
  </div>
</body></html>
